name: assemble-short

on:
  workflow_dispatch:
    inputs:
      short_id:
        description: "Short id (e.g. he-n03)"
        required: true
      release_tag:
        description: "Source asset release tag"
        required: true
      manifest:
        description: "Manifest path in repo"
        required: true
  push:
    paths:
      - 'assembly-requests/*.json'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve assembly request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHORT_ID='${{ inputs.short_id }}'
            RELEASE_TAG='${{ inputs.release_tag }}'
            MANIFEST_PATH='${{ inputs.manifest }}'
          else
            REQUEST_FILE=$(git diff-tree --no-commit-id --name-only --diff-filter=AM -r "${{ github.sha }}" -- 'assembly-requests/*.json' | tail -n 1)
            if [ -z "$REQUEST_FILE" ]; then
              echo "No added/modified assembly request found" >&2
              exit 1
            fi
            SHORT_ID=$(jq -r '.short_id // empty' "$REQUEST_FILE")
            RELEASE_TAG=$(jq -r '.release_tag // empty' "$REQUEST_FILE")
            MANIFEST_PATH=$(jq -r '.manifest // empty' "$REQUEST_FILE")
          fi
          test -n "$SHORT_ID"
          test -n "$RELEASE_TAG"
          test -n "$MANIFEST_PATH"
          test -f "$MANIFEST_PATH"
          echo "short_id=$SHORT_ID" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "manifest=$MANIFEST_PATH" >> "$GITHUB_OUTPUT"

      - name: Install assembly dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python3 -m pip install --upgrade pip
          python3 -m pip install openai-whisper
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Download transferred assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/assets work/output work/qa work/text
          gh release download '${{ steps.req.outputs.release_tag }}' \
            --repo '${{ github.repository }}' \
            --dir work/assets
          echo "Downloaded source assets:"
          find work/assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Verify every source asset with ffprobe
        run: |
          set -euo pipefail
          for f in work/assets/*; do
            ffprobe -v error -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 "$f" >/dev/null
          done

      - name: Generate burned-in caption and overlay track
        run: |
          set -euo pipefail
          python3 scripts/make_text_track.py \
            --audio work/assets/narration.mp3 \
            --manifest '${{ steps.req.outputs.manifest }}' \
            --out "work/text/${{ steps.req.outputs.short_id }}.ass" \
            --transcript "work/qa/${{ steps.req.outputs.short_id }}-transcript.txt" \
            --model base.en
          test -s "work/text/${{ steps.req.outputs.short_id }}.ass"

      - name: Assemble captioned narration-led Short
        run: |
          set -euo pipefail
          python3 scripts/assemble.py \
            --manifest '${{ steps.req.outputs.manifest }}' \
            --assets work/assets \
            --out work/output \
            --qa work/qa \
            --text-track "work/text/${{ steps.req.outputs.short_id }}.ass"

      - name: Show QA result
        run: |
          set -euo pipefail
          cat "work/qa/${{ steps.req.outputs.short_id }}.txt"

      - name: Publish captioned render and QA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FINAL_TAG='${{ steps.req.outputs.short_id }}-assembly-final'
          gh release delete "$FINAL_TAG" -y --cleanup-tag --repo '${{ github.repository }}' 2>/dev/null || true
          gh release create "$FINAL_TAG" work/output/* work/qa/* work/text/* \
            --repo '${{ github.repository }}' \
            --title "Captioned assembly ${{ steps.req.outputs.short_id }}" \
            --notes "Narration-led FFmpeg assembly with burned-in captions, mechanism overlays, and automated technical QA."

      - name: Record assembly success
        run: |
          set -euo pipefail
          git pull --rebase
          mkdir -p assembly-status
          cp "work/qa/${{ steps.req.outputs.short_id }}.txt" \
             "assembly-status/${{ steps.req.outputs.short_id }}.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "assembly-status/${{ steps.req.outputs.short_id }}.txt"
          git commit -m "Record captioned assembly result for ${{ steps.req.outputs.short_id }}" || exit 0
          git push
