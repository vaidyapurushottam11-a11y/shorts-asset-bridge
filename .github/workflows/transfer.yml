name: pikaso-transfer
# Downloads Magnific/Pikaso signed URLs on the runner and republishes them as
# PUBLIC release assets so the (allowlisted-to-GitHub) build sandbox can pull them.
# Trigger: Actions tab -> "Run workflow", via api.github.com workflow_dispatch,
# or by committing a request JSON under requests/*.json.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag / Short id (e.g. wy-02)"
        required: true
      manifest:
        description: 'JSON map {"outputName.ext":"signed_pikaso_url", ...}'
        required: true
  push:
    paths:
      - 'requests/*.json'

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out request file
        if: github.event_name == 'push'
        uses: actions/checkout@v4

      - name: Record push trigger diagnostic
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          echo "push trigger reached" > bridge-triggered.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bridge-triggered.txt
          git commit -m "Record bridge trigger diagnostic" || true
          git push

      - name: Resolve transfer request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf '%s' '${{ inputs.tag }}' > tag.txt
            printf '%s' '${{ inputs.manifest }}' > manifest.json
          else
            REQUEST_FILE=$(python3 - <<'PY'
          import json, os
          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          head = event.get('head_commit') or {}
          paths = []
          for key in ('added', 'modified'):
              paths.extend(head.get(key) or [])
          paths = [p for p in paths if p.startswith('requests/') and p.endswith('.json')]
          if not paths:
              raise SystemExit('No request JSON found in push event')
          print(paths[-1])
          PY
          )
            python3 - "$REQUEST_FILE" <<'PY'
          import json, sys
          request = json.load(open(sys.argv[1]))
          tag = request['tag']
          manifest = request['manifest']
          open('tag.txt', 'w').write(tag)
          json.dump(manifest, open('manifest.json', 'w'))
          PY
          fi
          echo "tag=$(cat tag.txt)" >> "$GITHUB_OUTPUT"

      - name: Download assets from Pikaso
        run: |
          set -euo pipefail
          mkdir -p assets
          python3 - <<'PY'
          import json
          m = json.load(open('manifest.json'))
          with open('dl.sh','w') as f:
              for name, url in m.items():
                  print(f"::add-mask::{url}")
                  f.write(f'curl -fSL --retry 4 --retry-delay 2 -o "assets/{name}" "{url}"\n')
          PY
          bash dl.sh
          echo "Downloaded:"; ls -la assets

      - name: Publish as a public Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='${{ steps.request.outputs.tag }}'
          gh release delete "$TAG" -y --cleanup-tag --repo "${{ github.repository }}" 2>/dev/null || true
          gh release create "$TAG" assets/* \
            --repo "${{ github.repository }}" \
            --title "Assets $TAG" \
            --notes "Automated Pikaso transfer (deterministic bridge)."
          echo "Release $TAG published with assets:"; ls assets

      - name: Record bridge self-test success
        if: github.event_name == 'push' && steps.request.outputs.tag == 'bridge-selftest'
        run: |
          set -euo pipefail
          echo "bridge self-test passed" > bridge-selftest-success.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bridge-selftest-success.txt
          git commit -m "Record bridge self-test success"
          git push
