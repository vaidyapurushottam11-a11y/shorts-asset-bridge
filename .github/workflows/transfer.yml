name: pikaso-transfer
# Downloads Magnific/Pikaso signed URLs on the runner and republishes them as
# PUBLIC release assets so the (allowlisted-to-GitHub) build sandbox can pull them.
# Trigger: Actions tab -> "Run workflow", via api.github.com workflow_dispatch,
# or by committing a request JSON under requests/*.json.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag / Short id (e.g. wy-02)"
        required: true
      manifest:
        description: 'JSON map {"outputName.ext":"signed_pikaso_url", ...}'
        required: true
  push:
    paths:
      - 'requests/*.json'

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out request file
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve transfer request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf '%s' '${{ inputs.tag }}' > tag.txt
            printf '%s' '${{ inputs.manifest }}' > manifest.json
          else
            REQUEST_FILE=$(git diff-tree --no-commit-id --name-only --diff-filter=AM -r "${{ github.sha }}" -- 'requests/*.json' | tail -n 1)
            if [ -z "$REQUEST_FILE" ]; then
              echo "No added/modified request JSON found in triggering commit" >&2
              exit 1
            fi
            python3 - "$REQUEST_FILE" <<'PY'
          import json, sys
          request = json.load(open(sys.argv[1]))
          tag = request['tag']
          manifest = request['manifest']
          open('tag.txt', 'w').write(tag)
          json.dump(manifest, open('manifest.json', 'w'))
          PY
          fi
          echo "tag=$(cat tag.txt)" >> "$GITHUB_OUTPUT"

      - name: Download assets from Pikaso
        run: |
          set -euo pipefail
          mkdir -p assets
          python3 - <<'PY'
          import json
          m = json.load(open('manifest.json'))
          with open('dl.sh','w') as f:
              for name, url in m.items():
                  print(f"::add-mask::{url}")
                  f.write(f'curl -fSL --retry 4 --retry-delay 2 -o "assets/{name}" "{url}"\n')
          PY
          bash dl.sh
          echo "Downloaded:"; ls -la assets

      - name: Publish as a public Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='${{ steps.request.outputs.tag }}'
          gh release delete "$TAG" -y --cleanup-tag --repo "${{ github.repository }}" 2>/dev/null || true
          gh release create "$TAG" assets/* \
            --repo "${{ github.repository }}" \
            --title "Assets $TAG" \
            --notes "Automated Pikaso transfer (deterministic bridge)."
          echo "Release $TAG published with assets:"; ls assets
